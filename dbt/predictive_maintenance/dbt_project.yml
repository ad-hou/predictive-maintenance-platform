name: predictive_maintenance
version: "1.0.0"
config-version: 2
profile: predictive_maintenance

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Freshness test: maximum age (hours) of the newest telemetry row. Large by default so that
  # historical / synthetic datasets pass; set e.g. --vars '{max_age_hours: 48}' in production.
  max_age_hours: 1000000

models:
  predictive_maintenance:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
