version: 2

models:
  - name: stg_machines
    columns:
      - name: machine_id
        data_tests: [not_null, unique]
      - name: age
        data_tests:
          - accepted_range: {arguments: {min_value: 0, max_value: 100}}

  - name: stg_telemetry
    data_tests:
      - unique_combination: {arguments: {columns: [machine_id, "timestamp"]}}
    columns:
      - name: machine_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_machines'), field: machine_id}}
      - name: "timestamp"
        data_tests:
          - not_null
          - recent_enough: {arguments: {max_hours: "{{ var('max_age_hours') }}"}}
      - name: voltage
        data_tests: [not_null, {accepted_range: {arguments: {min_value: 0, max_value: 400}}}]
      - name: rotation
        data_tests: [not_null, {accepted_range: {arguments: {min_value: 0, max_value: 1500}}}]
      - name: pressure
        data_tests: [not_null, {accepted_range: {arguments: {min_value: 0, max_value: 300}}}]
      - name: vibration
        data_tests: [not_null, {accepted_range: {arguments: {min_value: 0, max_value: 200}}}]

  - name: stg_errors
    columns:
      - name: machine_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_machines'), field: machine_id}}
      - name: "timestamp"
        data_tests: [not_null]

  - name: stg_maintenance
    columns:
      - name: machine_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_machines'), field: machine_id}}
      - name: "timestamp"
        data_tests: [not_null]

  - name: stg_failures
    columns:
      - name: machine_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_machines'), field: machine_id}}
      - name: "timestamp"
        data_tests: [not_null]
