name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pmp_test
          POSTGRES_USER: pmp
          POSTGRES_PASSWORD: pmp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmp -d pmp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PMP_TEST_DATABASE_URL: postgresql+psycopg2://pmp:pmp@localhost:5432/pmp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pmp
          POSTGRES_USER: pmp
          POSTGRES_PASSWORD: pmp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmp -d pmp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://pmp:pmp@localhost:5432/pmp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pmp
      POSTGRES_USER: pmp
      POSTGRES_PASSWORD: pmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Generate data and load it into PostgreSQL
        run: |
          python -m src.cli generate-data --machines 30 --days 60
          python -m src.cli load-postgres
      - name: DBT build (models and tests)
        run: |
          cp dbt/predictive_maintenance/profiles.yml.example dbt/predictive_maintenance/profiles.yml
          cd dbt/predictive_maintenance && dbt build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the three images
        run: |
          docker build -f docker/api.Dockerfile -t pmp-api .
          docker build -f docker/ml.Dockerfile -t pmp-ml .
          docker build -f docker/airflow.Dockerfile -t pmp-airflow .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
